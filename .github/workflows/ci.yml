name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Validate content
        run: npm run validate

      - name: Simulate 50 years
        run: npm run sim -- --years 50 --seed 1 --out out/chronicle-seed1-50y.md

      - name: Build
        run: npm run build

      - name: Upload chronicle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle
          path: out/
          if-no-files-found: ignore

  e2e:
    # Browser smoke test (S.1): the built game is opened and played; a failure fails the PR (D-430).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: out/e2e/
          if-no-files-found: ignore

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Metric gates (300 years, pinned seeds)
        run: npm run gates

  bots:
    # Report only (D-349): never fails the PR; the table goes to the job summary.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Bot report (4 characters, 5 seeds, 300 years)
        run: npx tsx tools/bot-report.ts --runs 5
