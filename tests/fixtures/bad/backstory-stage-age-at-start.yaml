# expect-error: backstory.stages[0].age /age 20 is not below settings.startAge.min 20/
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: origin
      age: 20
  texts: { leave: "{name} went out." }
events:
  - id: scene
    deck: backstory
    stage: origin
    weight: 1
    text: "A scene."
    options:
      - text: A
        result: "{name} did A."
