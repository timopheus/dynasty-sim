# expect-error: events[0].options[0].effects.later[0].effects.kill /only in the failure of a check in a heavy event/
events:
  - id: bad_event
    weight: 1
    severity: heavy
    text: "A fight."
    options:
      - text: Fight
        result: "{name} fought."
        effects: { later: [{ after_days: 3, effects: { kill: killed } }] }
