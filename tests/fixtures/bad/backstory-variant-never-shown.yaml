# expect-error: backstory.stages /variant "vb" is never shown/
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: origin
      offer: { count: 1, variants: [va, vb] }
    - id: later
  texts: { leave: "{name} went out." }
events:
  - id: scene
    deck: backstory
    stage: origin
    weight: 1
    text: "A scene."
    options:
      - text: A
        when: { offered: va }
        result: "{name} did A."
      - text: Plain
        result: "{name} did nothing."
