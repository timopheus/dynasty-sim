# expect-error: backstory.stages[1].age /stage "origin" before it has no age/
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: origin
    - id: later
      age: 7
  texts: { leave: "{name} went out." }
events:
  - id: scene
    deck: backstory
    stage: origin
    weight: 1
    text: "A scene."
    options:
      - text: A
        result: "{name} did A."
