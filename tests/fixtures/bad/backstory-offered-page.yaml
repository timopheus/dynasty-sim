# expect-error: events[0].pages.more.options /at least one option must have no when/
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: origin
      offer: { count: 1, variants: [va, vb] }
  texts:
    leave: "{name}, aged {age}, went out."

events:
  - id: bad_page
    deck: backstory
    stage: origin
    weight: 1
    text: "You were born."
    options:
      - text: House A
        when: { offered: va }
        next: more
      - text: House B
        when: { offered: vb }
        result: "{name} was born in house B."
    pages:
      more:
        text: "And then?"
        options:
          - text: Only A
            when: { offered: va }
            result: "{name} was born in house A."
