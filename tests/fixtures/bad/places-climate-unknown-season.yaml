# expect-error: places.climates[0].weather[0].season /unknown season "monsoon"/
places:
  kinds:
    - { id: town, name: a town }
  road: on the road
  list:
    - { id: ostmere, name: Ostmere, kind: town }
    - { id: valmont, name: Valmont, kind: town }
  roads:
    - { between: [ostmere, valmont], days: 6 }
  start: ostmere
  reasons: { kind: "Only in {kinds}", place: "Only in {places}", no_road: "No road" }
  climates:
    - id: mild
      weather:
        - { season: monsoon, name: fine, weight: 1 }
        - { season: winter, name: fine, weight: 1 }
        - { season: spring, name: fine, weight: 1 }
        - { season: summer, name: fine, weight: 1 }
        - { season: autumn, name: fine, weight: 1 }
