# expect-error: actions[0].when.at_place_kind /unknown kind of place "castle"/
places:
  kinds:
    - { id: town, name: a town }
  road: on the road
  list:
    - { id: ostmere, name: Ostmere, kind: town }
  roads: []
  start: ostmere
  reasons: { kind: "Only in {kinds}", place: "Only in {places}", no_road: "No road" }
actions:
  - id: siege
    name: Siege
    category: livelihood
    duration: { min: 5, max: 5 }
    when: { at_place_kind: [castle] }
    text: "{name} sat out a siege."
