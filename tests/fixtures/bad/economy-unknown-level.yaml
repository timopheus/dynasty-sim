# expect-error: actions[0].effects.gain /unknown price level "lavish"/
economy:
  income:
    - { status: commoner, crowns: 15 }
  levels:
    - { id: minor, part: "1/3" }
  reasons:
    afford: "Requires {crowns} crowns."
actions:
  - id: gamble
    name: Gamble
    duration: { min: 1, max: 1 }
    text: "{name} gambled."
    effects: { gain: lavish }
