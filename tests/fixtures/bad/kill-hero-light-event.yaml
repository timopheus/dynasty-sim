# expect-error: events[0].options[0].failure.effects.kill /only in the failure of a check in a heavy event/
events:
  - id: bad_event
    weight: 1
    severity: medium
    text: "A fight."
    options:
      - text: Fight
        check: { stat: prowess, difficulty: 10 }
        success: { result: "{name} won." }
        failure:
          result: "{name} lost."
          effects: { kill: killed_in_duel }
