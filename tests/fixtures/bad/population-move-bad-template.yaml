# expect-error: population.moves[0].text /unknown placeholder \{who\}/
population:
  circle: { min: 3, max: 5 }
  newcomerAge: { min: 20, max: 30 }
  driftPer10k: 0
  arriveFromFarPer100: 0
  far: { occupationChangePer10k: 0, returnPer10k: 0 }
  occupationReason: "Only for {occupations}"
  occupations: [{ id: porter, name: Porter, weight: 1 }]
  moves:
    - { action: wait, leave: { min: 1, max: 1 }, arrive: { min: 1, max: 1 }, text: "{who} moved." }
