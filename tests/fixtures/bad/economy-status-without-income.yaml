# expect-error: economy.income /no income for the house status "noble"/
house:
  statuses:
    - { id: commoner, name: Commoner }
    - { id: noble, name: Noble }
  renown:
    words:
      - { from: -1000, word: Unremarked }
    fame: [0, 1, 3, 6]
    traits: []
  nicknames: []
  texts:
    status: "The {house} house is now counted as {status}."
  reasons:
    status_min: "The house must be {status} or higher."
    renown_min: "The house must be known."
economy:
  income:
    - { status: commoner, crowns: 15 }
  levels:
    - { id: minor, part: "1/3" }
  work: []
  upkeep:
    status:
      - { status: commoner, part: "1/2" }
      - { status: noble, part: "3/4" }
    spouse: "1/5"
    child: "1/10"
    minor: "1/10"
  adjust:
    cap: 30
    stewardship: { from: 5, income: 2, upkeep: 2 }
    education: { income: 5 }
    traits: []
  texts:
    debt: "{name} fell into debt."
    lines: { work: Work, living: Living, spouse: Spouse, children: Children }
  reasons:
    afford: "Requires {crowns} crowns"
