# expect-error: backstory.stages[1].age /years of study before stage "later" can bring the founder to 13, past its age 12/
backstory:
  fromBirth: true
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: early
      age: 10
    - id: later
      age: 12
  texts: { leave: "{name} went out." }
actions:
  - { id: early_years, name: Early years, category: self, duration: { min: 1, max: 1 }, when: { backstory_only: true }, idle: true, text: "{name} grew up." }
events:
  - { id: early_scene, deck: backstory, stage: early, weight: 1, text: "School.", options: [{ text: Go, effects: { years: 3 }, result: "{name} went." }] }
  - { id: later_scene, deck: backstory, stage: later, weight: 1, text: "Later.", options: [{ text: Go, result: "{name} went on." }] }
