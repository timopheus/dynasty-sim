# expect-error: backstory.stages[0].age /age 25 is not below settings.startAge.min 20/
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: training
      age: 25
  fates:
    ages: { min: 2, max: 14 }
    missingPct: 0
    causes: [illness]
    texts: { father_died: "{name} lost {his} father, {parent}.", mother_died: "x", father_vanished: "x", mother_vanished: "x" }
  texts: { leave: "{name} went out." }
events:
  - { id: training_scene, deck: backstory, stage: training, weight: 1, text: "Service.", options: [{ text: Go, result: "{name} served." }] }
