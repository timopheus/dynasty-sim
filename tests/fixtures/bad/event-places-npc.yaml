# expect-error: events[0].places /not bound to the place of the hero/
places:
  kinds:
    - { id: town, name: a town }
  road: on the road
  list:
    - { id: ostmere, name: Ostmere, kind: town }
    - { id: valmont, name: Valmont, kind: town }
  roads:
    - { between: [ostmere, valmont], days: 6 }
  start: ostmere
  reasons: { kind: "Only in {kinds}", place: "Only in {places}", no_road: "No road" }
events:
  - id: road_event
    weight: 1
    who: npc
    places: [road]
    text: "Something on the road."
    options:
      - text: Go on
        result: "{name} went on."
