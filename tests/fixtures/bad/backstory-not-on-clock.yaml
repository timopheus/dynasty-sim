# expect-error: backstory.fromBirth /the backstory runs on the clock \(D-479\): fromBirth: true/
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: origin
      age: 0
  texts: { leave: "{name} went out." }
events:
  - id: scene
    deck: backstory
    stage: origin
    weight: 1
    text: "A scene."
    options:
      - text: A
        result: "{name} did A."
