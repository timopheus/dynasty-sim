events:
  - id: bad_check_optional
    weight: 1
    roles:
      foe: { pick: circle, optional: true }
    text: "Someone glares."
    options:
      - text: Stare back
        check: { stat: prowess, against: { role: foe, stat: prowess } }
        success: { result: "{name} won." }
        failure: { result: "{name} lost." }
