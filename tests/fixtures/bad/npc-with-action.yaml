# expect-error: events[0].actions /not bound to an action of the hero/
actions:
  - { id: bad_wait, name: Wait, category: self, duration: { min: 1, max: 2 }, text: "{name} waited." }
events:
  - id: bad_npc
    weight: 1
    who: npc
    actions: [bad_wait]
    text: "{name} goes about the day."
    options:
      - text: Walk
