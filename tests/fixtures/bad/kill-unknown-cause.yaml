events:
  - id: bad_event
    weight: 1
    severity: heavy
    text: "A fight."
    options:
      - text: Fight
        check: { stat: prowess, difficulty: 10 }
        success: { result: "{name} won." }
        failure:
          result: "{name} lost."
          effects: { kill: poisoned }
