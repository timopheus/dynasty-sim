# expect-error: events[0].options /the stage offers none/
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: origin
      offer: { count: 1, variants: [va, vb] }
    - id: youth
  texts:
    leave: "{name}, aged {age}, went out."

events:
  - id: bad_no_offer
    deck: backstory
    stage: youth
    weight: 1
    text: "You grew up."
    options:
      - text: As A
        when: { offered: va }
        result: "{name} grew up as A."
      - text: As B
        when: { offered: vb }
        result: "{name} grew up as B."
