# expect-error: economy.adjust.traits[0].id /unknown trait "vain"/
economy:
  income:
    - { status: commoner, crowns: 15 }
  levels:
    - { id: minor, part: "1/3" }
  work: []
  upkeep:
    status:
      - { status: commoner, part: "1/2" }
    spouse: "1/5"
    child: "1/10"
    minor: "1/10"
  adjust:
    cap: 30
    stewardship: { from: 5, income: 2, upkeep: 2 }
    education: { income: 5 }
    traits: [{ id: vain, income: 5 }]
  texts:
    debt: "{name} fell into debt."
    lines: { work: Work, living: Living, spouse: Spouse, children: Children }
  reasons:
    afford: "Requires {crowns} crowns"
