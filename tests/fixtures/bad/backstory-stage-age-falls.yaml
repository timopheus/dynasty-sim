# expect-error: backstory.stages[1].age /age 5 is below 7 of a stage before it/
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: origin
      age: 7
    - id: later
      age: 5
  texts: { leave: "{name} went out." }
events:
  - id: scene
    deck: backstory
    stage: origin
    weight: 1
    text: "A scene."
    options:
      - text: A
        result: "{name} did A."
