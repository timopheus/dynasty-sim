# Extra actions for tests/time.test.ts, on top of tests/fixtures/base.
actions:
  - id: winter_only
    name: Winter only
    duration: { min: 10, max: 10 }
    when: { season: [winter] }
    text: "{name} did a winter job."
  - id: rich
    name: Rich
    duration: { min: 10, max: 10 }
    when: { money_min: 100 }
    text: "{name} did a rich job."
  - id: adult
    name: Adult
    duration: { min: 10, max: 10 }
    when: { age_min: 30 }
    text: "{name} did an adult job."
  - id: young
    name: Young
    duration: { min: 10, max: 10 }
    when: { age_max: 25 }
    text: "{name} did a young job."
  - id: tick
    name: Tick
    duration: { min: 1, max: 1 }
    text: "{name} waited a day."
  - id: pay_later
    name: Pay later
    duration: { min: 10, max: 10 }
    effects: { later: [{ after_days: 15, effects: { money: 100 } }] }
    text: "{name} was promised pay."
  - id: omen
    name: Omen
    duration: { min: 1, max: 1 }
    effects: { later: [{ after_days: 5, effects: { end_action: true } }] }
    text: "{name} saw an omen."
