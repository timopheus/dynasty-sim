# Opinions for the inheritance tests (4.8): the succession opinions with `inherits_as`, the renown background and `inheritance`.
opinions:
  reasons:
    - { id: slight, name: Slight, value: -40, kind: harm, decay: { kind: fade, days: 100 } }
    - { id: insult, name: Insult, value: -60, kind: harm, decay: { kind: never }, inherits_as: father_enemy }
    - { id: gift, name: Gift, value: 20, kind: benefit, decay: { kind: fade, days: 100 } }
    - { id: debt, name: Debt, value: 30, kind: benefit, decay: { kind: held, until: repaid }, inherits_as: father_debt }
    - { id: rescue, name: Rescue, value: 90, kind: benefit, decay: { kind: never } }
    - { id: father_enemy, name: Heir of my enemy, value: -25, kind: harm, decay: { kind: never } }
    - { id: father_debt, name: Heir of my debtor, value: 10, kind: benefit, decay: { kind: held, until: repaid } }
    - { id: passed_over, name: Passed over, value: -40, kind: harm, decay: { kind: never } }
  traitEffects:
    - { trait: vengeful, kind: harm, fade: 0 }
    - { trait: forgiving, kind: harm, fade: 200 }
    - { trait: generous, kind: benefit, scale: 50 }
    - { trait: greedy, kind: benefit, scale: 150 }
  background:
    max: 10
    renown:
      - { from: -100, value: -3 }
      - { from: 0, value: 0 }
      - { from: 5, value: 4 }
      - { from: 15, value: 9 }
    rules:
      - { holder: proud, target: proud, value: -8 }
      - { holder: proud, target: humble, value: -5 }
      - { holder: brave, target: brave, value: 6 }
  words:
    - { from: -100, text: hatred }
    - { from: -50, text: dislike }
    - { from: -10, text: indifference }
    - { from: 10, text: liking }
    - { from: 50, text: devotion }
  relations:
    - { id: friend, name: Friend, symmetric: true, opinion: { a: 25, b: 25 }, acquaintance: close, starts: "{name} befriended {other}.", ends: "{name} fell out with {other}." }
    - { id: rival, name: Rival, symmetric: true, opinion: { a: -30, b: -30 }, acquaintance: known, starts: "{name} and {other} became rivals.", ends: "{name} and {other} made peace." }
    - { id: patron, name: Patron, symmetric: false, opinion: { a: 10, b: 20 }, acquaintance: close, starts: "{name} took {other} under {his} wing.", ends: "{name} dropped {other}.", startsAsProtege: "{other} took {name} in.", endsAsProtege: "{other} dropped {name}." }
    - { id: guardian, name: Guardian, symmetric: false, opinion: { a: 15, b: 10 }, acquaintance: close, starts: "{name} took charge of {other}.", ends: "{name} let {other} go.", startsAsProtege: "{other} became the guardian of {name}.", endsAsProtege: "{name} came of age, leaving {other}." }
  inheritance:
    feudRelation: rival
    feudText: "{name} became heir to the feud between {deceased} and {other}."
  acquaintance: { meetPer100: 100, closeAfterDays: 30, closePer100: 100 }
  texts:
    opinionMin: "Needs {word} towards {name}"
    opinionMax: "Needs at most {word} towards {name}"
    relation: "Needs {kind} with {name}"
    relationNone: "No {kind} with {name}"
    acquaintedKnown: "Know {name}"
    acquaintedClose: "Be close to {name}"
