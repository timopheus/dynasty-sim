# Backstory of the fixture: exact numbers (stats_roll with min = max), goes on top of base, population and opinions.
# On the clock (D-479, T.4): the founder is born on day 0 and the scenes come in the years of their stages.
backstory:
  fromBirth: true
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    - id: origin
      age: 0
      offer: { count: 2, variants: [va, vb, vc] }
    - id: childhood
      age: 7
    - id: training
      age: 15
  fates:
    ages: { min: 2, max: 14 }
    missingPct: 25
    causes: [illness, killed]
    texts:
      father_died: "{name} was {age} when {his} father, {parent}, died."
      mother_died: "{name} was {age} when {his} mother, {parent}, died."
      father_vanished: "{name} was {age} when {his} father, {parent}, went away."
      mother_vanished: "{name} was {age} when {his} mother, {parent}, went away."
  texts:
    leave: "{name}, aged {age}, went out."

actions:
  - id: early_years
    name: Early years
    category: self
    duration: { min: 1, max: 1 }
    when: { backstory_only: true }
    idle: true
    text: "{name} grew up."

events:
  - id: origin_scene
    deck: backstory
    stage: origin
    weight: 1
    mood: neutral
    text: "You were born."
    options:
      - text: House A
        when: { offered: va }
        effects: { stats_roll: { martial: { min: 2, max: 2 } } }
        result: "{name} was born in house A."
        chronicle: true
      - text: House B
        when: { offered: vb }
        effects: { stats_roll: { learning: { min: 2, max: 2 } } }
        result: "{name} was born in house B."
        chronicle: true
      - text: House C
        when: { offered: vc }
        effects: { stats_roll: { diplomacy: { min: 2, max: 2 } } }
        result: "{name} was born in house C."
        chronicle: true
      - text: Nowhere in particular
        effects: { money: 5 }
        result: "{name} was born nowhere in particular."
        chronicle: true

  - id: childhood_mentor
    deck: backstory
    stage: childhood
    weight: 1000
    mood: joy
    roles:
      mentor: { pick: circle, where: { occupation: [porter] } }
    text: "{mentor} takes an interest in you."
    options:
      - text: Listen
        effects: { stats_roll: { intrigue: { min: 1, max: 1 } } }
        on: { mentor: { opinion: [{ toward: hero, reason: gift }] } }
        result: "{name} learned from {mentor}."
        chronicle: true
        mood: joy
      - text: Run off
        result: "{name} ran off from {mentor}."
        chronicle: true

  - id: childhood_plain
    deck: backstory
    stage: childhood
    weight: 1
    text: "A quiet year."
    options:
      - text: Work
        effects: { money: 3 }
        result: "{name} worked through a quiet year."
        chronicle: true

  - id: training_school
    deck: backstory
    stage: training
    weight: 1
    text: "You are sent to school."
    options:
      - text: Go
        effects: { years: 1, traits: { add: [courtly_1] } }
        result: "{name} went to school."
        chronicle: true
