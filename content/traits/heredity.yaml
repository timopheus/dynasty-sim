# Inherited lines of the body (D-329, 4.20): wit and health. `heritage` is the chance out of 10000 that a child gets
# the trait (`one` parent has it, `both` parents have it, `up` the next level of the line when both parents hold this
# level). Higher levels are never generated at random (weight 0): they come by blood or by events. The two last health
# traits are secret until a physician says so (content/events/heredity.yaml).
traits:
  - id: quick
    name: Quick-witted
    category: body
    stats: { learning: 1 }
    visibility: normal
    weight: 2
    line: { id: wit, level: 1 }
    heritage: { one: 2500, both: 5500, up: 800 }

  - id: clever
    name: Clever
    category: body
    stats: { learning: 2, intrigue: 1 }
    visibility: normal
    line: { id: wit, level: 2 }
    heritage: { one: 2200, both: 5000, up: 300 }

  - id: brilliant
    name: Brilliant
    category: body
    stats: { learning: 4, intrigue: 1, diplomacy: 1 }
    visibility: normal
    line: { id: wit, level: 3 }
    heritage: { one: 2000, both: 4500 }

  - id: robust
    name: Robust
    category: body
    opposite: frail
    visibility: normal
    weight: 2
    mortalityPct: 85
    line: { id: hardiness, level: 1 }
    heritage: { one: 2500, both: 5500, up: 600 }

  - id: long_lived
    name: Long-lived
    category: body
    opposite: sickly
    visibility: secret
    mortalityPct: 60
    line: { id: hardiness, level: 2 }
    heritage: { one: 2000, both: 5000 }

  - id: frail
    name: Frail
    category: body
    opposite: robust
    stats: { prowess: -1 }
    visibility: normal
    weight: 2
    mortalityPct: 130
    line: { id: frailty, level: 1 }
    heritage: { one: 2500, both: 5500, up: 600 }

  - id: sickly
    name: Sickly
    category: body
    opposite: long_lived
    stats: { prowess: -2 }
    visibility: secret
    mortalityPct: 170
    conceptionPct: 70
    line: { id: frailty, level: 2 }
    heritage: { one: 2000, both: 5000 }
