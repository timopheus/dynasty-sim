# Opinions, relations and acquaintance (D-035…D-037). Schema: src/core/relations/content.ts (OpinionsContentSchema).
# Events add and take away reasons and relations through the effects `opinion`, `opinion_end`, `relation` (3.6, D-220…D-225).
opinions:
  # Causes of an opinion. kind: harm or benefit decides which trait memory applies. decay: fade (days), never, or
  # held (until an event ends it by name).
  reasons:
    - { id: insulted_in_public, name: Insulted in public, value: -60, kind: harm, decay: { kind: never }, inherits_as: father_enemy }
    - { id: killed_kin, name: Killed kin, value: -90, kind: harm, decay: { kind: never }, inherits_as: father_killer }
    - { id: father_enemy, name: Enemy of my father, value: -30, kind: harm, decay: { kind: never } }
    - { id: father_killer, name: Killed my father, value: -55, kind: harm, decay: { kind: never } }
    - { id: owed_my_father, name: Owed my father, value: 10, kind: benefit, decay: { kind: held, until: debt_repaid } }
    - { id: wronged, name: Did me wrong, value: -35, kind: harm, decay: { kind: fade, days: 1460 }, inherits_as: father_enemy }
    - { id: slighted, name: Slighted me, value: -15, kind: harm, decay: { kind: fade, days: 365 } }
    - { id: gift, name: Gave a gift, value: 20, kind: benefit, decay: { kind: fade, days: 365 } }
    - { id: favour, name: Did me a service, value: 35, kind: benefit, decay: { kind: fade, days: 1460 } }
    - { id: saved_life, name: Saved my life, value: 70, kind: benefit, decay: { kind: never } }
    - { id: owes_me, name: Owes me, value: 15, kind: benefit, decay: { kind: held, until: debt_repaid }, inherits_as: owed_my_father }
    - { id: shamed_me, name: Shamed me, value: -40, kind: harm, decay: { kind: held, until: debt_repaid }, inherits_as: father_enemy }
    # Starting set for the events of stage 3 (D-223); after 3.6 only 3.12 and 3.13 add reasons.
    - { id: betrayed, name: Betrayed me, value: -70, kind: harm, decay: { kind: never }, inherits_as: father_enemy }
    - { id: humiliated, name: Humiliated me, value: -50, kind: harm, decay: { kind: fade, days: 1825 }, inherits_as: father_enemy }
    - { id: called_coward, name: Called me a coward, value: -35, kind: harm, decay: { kind: fade, days: 1460 } }
    - { id: spared, name: Spared me, value: 45, kind: benefit, decay: { kind: never } }
    - { id: mentor, name: Taught me, value: 40, kind: benefit, decay: { kind: fade, days: 3650 } }
    - { id: childhood_friend, name: Friend since childhood, value: 30, kind: benefit, decay: { kind: never } }
    # Added by 3.12 for the first batch of events with roles (D-280).
    - { id: defeated_me, name: Defeated me, value: -25, kind: harm, decay: { kind: fade, days: 1460 } }
    - { id: cheated_me, name: Cheated me, value: -45, kind: harm, decay: { kind: fade, days: 1825 }, inherits_as: father_enemy }
    - { id: comrade, name: Stood beside me, value: 25, kind: benefit, decay: { kind: fade, days: 1825 } }
    - { id: nursed_me, name: Nursed me, value: 30, kind: benefit, decay: { kind: fade, days: 1825 } }
    - { id: no_spine, name: Showed no spine, value: -20, kind: harm, decay: { kind: fade, days: 1460 } }
    - { id: stood_by_me, name: Stood by me when it counted, value: 40, kind: benefit, decay: { kind: fade, days: 1825 } }
    # Added by 4.6: the heir by law whom a will passed over (D-314); disputes over the inheritance are events (4.15).
    - { id: passed_over, name: Passed over in the will, value: -40, kind: harm, decay: { kind: never } }

  # Memory of the holder: fade 0 never forgets, 200 forgets twice as fast; scale is the weight of the reason.
  traitEffects:
    - { trait: vengeful, kind: harm, fade: 0 }
    - { trait: forgiving, kind: harm, fade: 200 }
    - { trait: generous, kind: benefit, scale: 70 }
    - { trait: greedy, kind: benefit, scale: 140 }
    - { trait: wrathful, kind: harm, scale: 130 }
    - { trait: trusting, kind: harm, scale: 80 }

  # Constant part from traits of the holder towards traits of the other person; `max` limits their sum.
  background:
    max: 30
    # 4.8: renown of the target's house for holders outside it; the last step whose `from` is <= the renown.
    renown:
      - { from: -1000, value: -8 }
      - { from: -10, value: -4 }
      - { from: -2, value: 0 }
      - { from: 5, value: 4 }
      - { from: 15, value: 8 }
      - { from: 30, value: 12 }
    rules:
      - { holder: proud, target: proud, value: -8 }
      - { holder: honest, target: honest, value: 8 }
      - { holder: honest, target: deceitful, value: -12 }
      - { holder: deceitful, target: deceitful, value: 5 }
      - { holder: brave, target: craven, value: -8 }
      - { holder: craven, target: brave, value: -4 }
      - { holder: generous, target: greedy, value: -6 }
      - { holder: greedy, target: generous, value: 4 }
      - { holder: ambitious, target: ambitious, value: -6 }
      - { holder: diligent, target: lazy, value: -10 }
      - { holder: lazy, target: diligent, value: -4 }
      - { holder: wrathful, target: calm, value: -4 }
      - { holder: calm, target: wrathful, value: -6 }
      - { holder: trusting, target: honest, value: 6 }
      - { holder: suspicious, target: suspicious, value: -5 }

  # Opinion in words, from the lowest value up (GDD 8.6).
  words:
    - { from: -100, text: hatred }
    - { from: -60, text: dislike }
    - { from: -30, text: coolness }
    - { from: -10, text: indifference }
    - { from: 10, text: liking }
    - { from: 30, text: friendship }
    - { from: 60, text: devotion }

  # Relations are made and broken by events (D-036). In a pair `a` is the patron; opinion is what a thinks of b and b of a.
  relations:
    # starts / ends are chronicle lines when an event changes the hero's tie: {name} is the hero, {other} the other person.
    # In a patron-protege pair they are for the hero as the patron; startsAsProtege / endsAsProtege for the hero as the protege.
    - id: friend
      name: Friend
      symmetric: true
      opinion: { a: 25, b: 25 }
      acquaintance: close
      starts: "{name} befriended {other}."
      ends: "{name} and {other} ceased to be friends."
    - id: rival
      name: Rival
      symmetric: true
      opinion: { a: -30, b: -30 }
      acquaintance: known
      starts: "{name} made a rival of {other}."
      ends: "{name} and {other} ceased to be rivals."
    - id: patron
      name: Patron
      symmetric: false
      opinion: { a: 10, b: 20 }
      acquaintance: close
      starts: "{name} took {other} under {his} wing."
      ends: "{name} no longer looked after {other}."
      startsAsProtege: "{other} became {name}'s patron."
      endsAsProtege: "{other} no longer looked after {name}."
    - id: lover
      name: Lover
      symmetric: true
      opinion: { a: 30, b: 30 }
      acquaintance: close
      starts: "{name} and {other} became lovers."
      ends: "{name} and {other} parted as lovers."
    # Guardian of a head under age (4.6, D-314): `a` is the guardian; it ends when the ward comes of age. Events take the
    # guardian as a role with `pick: relation, kind: guardian`.
    - id: guardian
      name: Guardian
      symmetric: false
      opinion: { a: 15, b: 10 }
      acquaintance: close
      starts: "{name} became the guardian of {other}."
      ends: "{name} was no longer the guardian of {other}."
      startsAsProtege: "{other} became the guardian of {name}."
      endsAsProtege: "{name} came of age and left the guardianship of {other}."

  # 4.8: what passes to the heir with the head. Reasons with `inherits_as` become the weaker reason against the heir; a rival
  # of the head who holds such a reason becomes a rival of the heir. {name} the heir, {other} the enemy, {deceased} the head.
  inheritance:
    feudRelation: rival
    feudText: "{name} became heir to the feud between {deceased} and {other}."

  # Time near the hero (D-037): the chances are checked once a week against the circle of 2.5.
  acquaintance:
    meetPer100: 6
    closeAfterDays: 730
    closePer100: 1

  # Why a condition on opinions and relations is not met (D-043, D-221). {word}: opinion word of the bound; {kind}: kind
  # of relation in lower case; {name}: the other person (for `acquainted`, the person the condition is about).
  texts:
    opinionMin: "Needs {word} towards {name}"
    opinionMax: "Needs no more than {word} towards {name}"
    relation: "Needs a bond with {name}: {kind}"
    relationNone: "Must not be bound to {name} as {kind}"
    acquaintedKnown: "You must know {name}"
    acquaintedClose: "You must be close to {name}"
