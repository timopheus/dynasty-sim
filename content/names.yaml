# Name pools and character texts. Schema: NamesSchema (src/core/character/content.ts).
names:
  given:
    male:
      - Edmund
      - Thomas
      - William
      - Henry
      - Robert
      - Richard
      - Hugh
      - Walter
      - Arthur
      - Francis
      - Matthew
      - Nicholas
      - Simon
      - Roger
    female:
      - Anne
      - Catherine
      - Eleanor
      - Margaret
      - Isabel
      - Joan
      - Mary
      - Alice
      - Susanna
      - Judith
      - Frances
      - Lucy
  surnames:
    - Harlow
    - Ashby
    - Calder
    - Dunmore
    - Fenwick
    - Holloway
    - Merrick
    - Thorne
  # Words for stat values: the last step whose `from` is not above the value.
  statScale:
    - { from: 0, word: Wretched }
    - { from: 4, word: Poor }
    - { from: 8, word: Average }
    - { from: 12, word: Good }
    - { from: 16, word: Excellent }
    - { from: 20, word: Brilliant }
  # Fame steps, from a private person to someone known to all.
  fame:
    - Private person
    - Local figure
    - Known across the realm
    - Known to all
  # Shown on an action that needs one sex, to a character of the other.
  requiresSex:
    male: "Closed to women in this age."
    female: "Open only to women."
  # Stat names in the reasons below.
  stats:
    diplomacy: Diplomacy
    martial: Martial
    stewardship: Stewardship
    intrigue: Intrigue
    learning: Learning
    prowess: Prowess
  # Why an option is grey (D-043). {traits}: trait names; {stat}, {value}; {fame}: the fame step.
  reasons:
    traits_any: "Needs to be {traits}"
    traits_none: "Not for someone who is {traits}"
    stat_min: "Needs {stat} {value} or more"
    stat_max: "Needs {stat} {value} or less"
    fame_min: "Needs to be: {fame}"
