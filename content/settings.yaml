# Global simulation settings. Schema: src/core/content/schema.ts (SettingsSchema).
# Text placeholders: {name}, {age}. Avoid pronouns: characters have no gender yet.
settings:
  eventChancePer10k: 150        # chance per day that an event fires, out of 10000
  minDaysBetweenEvents: 20      # storyteller pacing: quiet days after any event
  eventRepeatCooldownDays: 365  # the same event cannot repeat within this time
  startAge: { min: 18, max: 26 }
  heirAge: { min: 16, max: 25 } # placeholder heir until the Dynasty stage (D-007)
  startHealth: { min: 80, max: 100 }
  startMoney: 50
  texts:
    start: "{name}, aged {age}, set out into the world with a horse, a sword and a few coins."
    death: "{name} died at the age of {age}."
    succession: "{name}, aged {age}, took up the name and the fortunes of the house."
