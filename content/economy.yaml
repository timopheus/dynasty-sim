# Economy (D-326, D-441): the reference income R of each house status and the price levels as parts of it.
# Numbers are the approved reference docs/reference/prices-1700.md, calibration "moderate". The monthly balance is S.7.
economy:
  income:
    - { status: commoner, crowns: 15 }
    - { status: guild, crowns: 50 }
    - { status: noble, crowns: 200 }
  levels:
    - { id: trifle, part: "1/10" }
    - { id: minor, part: "1/3" }
    - { id: notable, part: 1 }
    - { id: major, part: 4 }
    - { id: ruinous, part: 12 }
  reasons:
    afford: "Requires {crowns} crowns."
