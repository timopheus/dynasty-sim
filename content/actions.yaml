# Actions the player can start. Duration is in days, rolled when the action starts.
# Grown-up actions need `age_min: 16` (settings.adultAge): a hero under age plays the actions of a child (D-314);
# resting is for everyone (a sick child must be able to recover, D-366).
# `when` (optional) limits when the action can be started: season, money_min, age_min, age_max,
# sex (D-034: paths closed by the customs of 1700), fit (no severe wound or illness).
# Every action but the ones of `health.rest.actions` needs `fit: true`: a severely ill hero cannot start what the health
# phase would break off the next day (it would end each day before the family phase).
# Rest and the road change the course of conditions: lists in content/health.yaml.
# `at_place_kind` (S.9): where the action can be done, by the kind of the hero's place (`road`: on the road). "Live as you will"
# is lived in a place: on the road the clock stops and the player says where to go or what to do (S.9, D-462).
# `target: place` (S.9a): the action goes to a place the player names; the days of the shortest road replace its duration.
# `category` is the shelf of the actions panel: livelihood, road, family or self (D-443).
# `until` (optional, D-466): the goal; once its `when` holds, the action completes early (its `text`, or `until.text`; null — no line).
# `text` is written to the chronicle when the action completes. Schema: ActionSchema.
actions:
  # The hero lives his own life (D-325): time runs and events come, nothing is done on purpose. It ends the usual way
  # (the clock stops, the player chooses what next; the same action again goes on living), writes no chronicle line.
  - id: live
    name: Live as you will
    category: self
    duration: { min: 30, max: 60 }
    when: { age_min: 16, fit: true, at_place_kind: [city, town, village] }
    idle: true
    text: "{name} lived as {he} pleased."

  - id: travel
    name: Travel the roads
    category: road
    duration: { min: 10, max: 40 }
    target: place
    when: { age_min: 16, fit: true }
    effects: { money: -5 }
    text: "{name} came to the end of a journey on the roads."

  - id: serve_contract
    name: Serve under contract
    category: livelihood
    duration: { min: 60, max: 180 }
    when: { age_min: 18, sex: male, fit: true, at_place_kind: [city, town] }
    text: "{name} finished a contract of service and was paid off."

  - id: winter_quarters
    name: Winter in quarters
    category: road
    duration: { min: 60, max: 120 }
    when: { age_min: 16, season: [autumn, winter], money_min: 20, at_place_kind: [city, town, village] }
    effects: { money: -20, heal: all }
    text: "{name} wintered in quiet quarters and recovered strength."

  - id: rest
    name: Rest and recover
    category: self
    duration: { min: 7, max: 28 }
    effects: { money: -3 }
    text: "{name} spent a few quiet weeks resting."

  - id: trade
    name: Try a small trade
    category: livelihood
    duration: { min: 20, max: 60 }
    when: { age_min: 16, fit: true, at_place_kind: [city, town] }
    text: "{name} wound up a small trading venture with a modest profit."

  - id: hunt
    name: Go hunting
    category: livelihood
    duration: { min: 3, max: 14 }
    when: { age_min: 16, fit: true, at_place_kind: [village, road] }
    text: "{name} returned from the hunt with game to sell."

  # Only the `will` command starts it (D-314, D-360): the will takes effect at its end; content/succession.yaml.
  - id: notary
    name: Draw up a will at the notary
    category: family
    duration: { min: 3, max: 7 }
    when: { will_command: true, fit: true }
    effects: { will_signed: true }
    text: "{name} came back from the notary with a will drawn up and sealed."

  # A hero under age (D-314): years under the guardian and lessons. Events of upbringing are bound to them (4.13).
  - id: grow_up
    name: Grow up under guardianship
    category: self
    duration: { min: 365, max: 365 }
    when: { age_max: 14, fit: true }
    text: "{name} grew another year older under the care of {his} guardian."

  - id: lessons
    name: Take lessons
    category: self
    duration: { min: 90, max: 150 }
    when: { age_min: 7, age_max: 15, fit: true }
    until: { when: { age_min: 16 } }
    effects: { money: -3, stats: { learning: 1 } }
    text: "{name} spent a season at {his} lessons."
