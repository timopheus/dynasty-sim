# Backstory of the first hero (D-038, D-167, task 3.11). Schema: src/core/backstory/content.ts (BackstoryContentSchema).
# New game: the founder is brought to this base (no traits, no education), then one scene of each stage is shown, in
# this order, before the first action. Scenes are events with `deck: backstory` and `stage:` (scenes.yaml).
backstory:
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  stages:
    # The player is offered 3 of the 6 variants by chance and picks one (D-167, D-188).
    - id: origin
      offer:
        count: 3
        variants: [guild_house, soldier_family, parish_house, gentry_house, waterfront, plain_house]
    - id: childhood
    - id: youth
    - id: training
    - id: leaving
  texts:
    leave: "{name}, aged {age}, went out into the world."
