# Backstory of the first hero (D-038, D-167, task 3.11). Schema: src/core/backstory/content.ts (BackstoryContentSchema).
# One clock (D-479): the game begins with the founder's birth on 1 January 1700; he is brought to this base (no traits,
# no education) and lives his childhood in living time, one scene of each stage in its year, the world going on between
# them. Scenes are events with `deck: backstory` and `stage:` (scenes.yaml).
backstory:
  fromBirth: true
  base: { diplomacy: 5, martial: 5, stewardship: 5, intrigue: 5, learning: 5, prowess: 5 }
  # `age`: the first scene of the stage falls on a day of that year of the founder's life; `leaving` has none and comes
  # right after the stage before it and the years of study; he goes out into the world not before 16 (D-038).
  stages:
    # The player is offered 3 of the 6 variants by chance and picks one (D-167, D-188).
    - id: origin
      age: 0
      offer:
        count: 3
        variants: [guild_house, soldier_family, parish_house, gentry_house, waterfront, plain_house]
    - id: childhood
      age: 7
    - id: youth
      age: 12
    - id: training
      age: 15
    - id: leaving
  # Fates of the founder's parents (D-481): each parent alive at the birth dies or goes missing on a day of the
  # founder's childhood, between these ages; the line is about the founder, {age} his age that day.
  fates:
    ages: { min: 2, max: 14 }
    missingPct: 25
    causes: [illness, fever, killed]
    texts:
      # each starts with {name} and a verb: the section of the founder cuts the name off (ownLine, D-162)
      father_died: "{name} lost {his} father, {parent}, at {age}."
      mother_died: "{name} lost {his} mother, {parent}, at {age}."
      father_vanished: "{name} lost {his} father at {age}: {parent} went out one morning and never came back."
      mother_vanished: "{name} lost {his} mother at {age}: {parent} went out one morning and never came back."
  texts:
    leave: "{name}, aged {age}, went out into the world."
