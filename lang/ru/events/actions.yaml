translations:
  - en: Armed men step out of the hedge <road_weather> and bar the road. One of them names a price for your passage.
    text: null
  - en: Fight them
    text: null
  - en: "{name} fought off highwaymen on the road and took their purse."
    text: null
  - en: "{name} was beaten and robbed by highwaymen on the road."
    text: null
  - en: Pay them off
    text: null
  - en: "{name} paid off highwaymen on the road."
    text: null
  - en: A cart wheel cracks on a muddy road{wheelwright?, and {wheelwright} is already looking over the damage}.
    text: null
  - en: Pay a wheelwright
    text: null
