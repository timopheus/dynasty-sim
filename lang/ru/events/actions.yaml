    text: null
  - en: Mend it yourself
    text: null
  - en: "{name} mended a broken wheel by hand in the mud."
    text: null
  - en: "{name} botched the mending of a broken wheel and paid twice for it."
    text: null
  - en: On the road you fall in step with {companion}, who is bound the same way and offers to share the miles and the cost of the inns.
    text: null
  - en: Share the road and the cost
    text: null
