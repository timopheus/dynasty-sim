    text: null
  - en: "{name} charged a bandit ambush alone and was cut down."
    text: null
  - en: Run with {coward}
    text: null
  - en: "{name} fled a bandit ambush with {coward}, leaving {employer}'s wine to the robbers."
    text: null
  - en: "<Dawn> {sergeant} shakes you awake: skirmishers are fording the river below the camp, and the officers are nowhere to be seen."
    text: null
